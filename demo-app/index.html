<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExpAgent demo — checkout</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 4rem auto; padding: 0 1rem; }
  .card { border: 1px solid #ddd; border-radius: 12px; padding: 2rem; }
  #cta { background: #1a73e8; color: #fff; border: 0; border-radius: 8px;
         padding: 0.9rem 1.6rem; font-size: 1.1rem; cursor: pointer; }
  #log { margin-top: 1rem; color: #555; font-size: 0.9rem; white-space: pre-wrap; }
  code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>Demo checkout</h1>
  <p>The headline button below is driven by the Flagsmith flag
     <code>checkout-cta</code>. The variant copy comes from the flag value;
     clicking it sends the <code>checkout_completed</code> event, which is the
     metric the ExpAgent plan measures.</p>
  <!-- The snippet in snippet.js (generated by agent/plan.py) is inlined here. -->
  <button id="cta">Buy now</button>
  <div id="log">waiting for Flagsmith…</div>
</div>
<script type="module">
  import flagsmith from 'https://cdn.jsdelivr.net/npm/flagsmith@12.4.0/+esm';
  const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
  try {
    await flagsmith.init({
      environmentID: '<YOUR_ENVIRONMENT_ID>',
      api: 'https://edge.api.flagsmith.com/api/v1/',
    });
    const value = flagsmith.getValue('checkout-cta');
    document.getElementById('cta').textContent = value;
    log('flag checkout-cta = ' + JSON.stringify(value));
    document.getElementById('cta').addEventListener('click', () => {
      flagsmith.track('checkout_completed');
      log('event sent: checkout_completed');
    });
  } catch (e) {
    log('Flagsmith not initialised (set YOUR_ENVIRONMENT_ID): ' + e.message);
  }
</script>
</body>
</html>
